<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Files — King Saud Medical City</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f8fafc; --bg2:#f1f5f9; --surface:#ffffff;
    --border:#e2e8f0; --tp:#1e293b; --ts:#64748b; --th:#94a3b8;
    --green:#059669; --greenl:#d1fae5;
    --amber:#d97706; --amberl:#fef3c7;
    --red:#dc2626; --redl:#fee2e2;
    --blue:#0ea5e9; --bluel:#e0f2fe;
    --purple:#7c3aed; --purplel:#ede9fe;
    --teal:#0d9488; --teall:#ccfbf1;
    --primary:#0f766e;
  }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--tp); min-height:100vh; font-size:14px; }

  /* Header */
  .hdr { background:#0f766e; padding:0 28px; height:64px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(15,118,110,0.2); }
  .hdr-logo { display:flex; align-items:center; gap:12px; }
  .logo-ic { width:36px; height:36px; background:#14b8a6; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:white; }
  .hdr-title { font-size:15px; font-weight:700; color:#f0fdfa; }
  .hdr-sub { font-size:11px; color:#99f6e4; margin-top:1px; }
  .hdr-stats { display:flex; gap:6px; align-items:center; }
  .st-item { text-align:center; padding:6px 14px; border-radius:10px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); min-width:76px; }
  .st-num { font-size:20px; font-weight:700; line-height:1; }
  .st-lbl { font-size:10px; color:#99f6e4; margin-top:3px; text-transform:uppercase; }

  /* Main */
  .main { padding:20px 28px; }
  .fc { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
  .fr { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .fg { display:flex; flex-direction:column; gap:8px; flex:1; min-width:140px; }
  .fg-lbl { font-size:10px; font-weight:600; color:#475569; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; gap:6px; }
  .fg-lbl::before { content:''; width:3px; height:12px; background:#14b8a6; border-radius:2px; display:inline-block; }
  .fps { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { padding:5px 12px; border-radius:20px; font-size:12px; border:1px solid var(--border); background:var(--bg2); color:#475569; cursor:pointer; transition:all 0.15s; user-select:none; white-space:nowrap; }
  .pill:hover { border-color:#14b8a6; background:var(--teall); }
  .pill.on { background:#0f766e; border-color:#0f766e; color:white; font-weight:600; }
  .pill.all-pill.on { color:white; font-weight:700; box-shadow:0 2px 8px rgba(15,118,110,0.3); }

  .si { padding:8px 13px; border-radius:9px; font-size:13px; border:1px solid var(--border); background:var(--bg2); color:var(--tp); font-family:inherit; transition:all 0.15s; }
  .si::placeholder { color:var(--th); }
  .si:focus { outline:none; border-color:#14b8a6; background:white; }
  .btn { padding:8px 15px; border-radius:9px; font-size:12px; border:1px solid var(--border); background:var(--bg2); color:#475569; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:6px; white-space:nowrap; transition:all 0.15s; font-weight:500; }
  .btn:hover { background:var(--teall); border-color:#14b8a6; color:#0f766e; }
  .btn svg { width:13px; height:13px; }
  .btn-refresh { background:#0f766e; border-color:#0f766e; color:white; font-weight:600; }
  .btn-refresh:hover { background:#0d9488; border-color:#0d9488; color:white; }

  /* Results */
  .rb { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 2px; }
  .rc { font-size:12px; color:var(--ts); }
  .rc span { font-weight:700; color:var(--tp); }

  /* Table */
  .tc { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { padding:11px 16px; text-align:left; font-size:10px; font-weight:600; color:#475569; background:#f8fafc; border-bottom:1px solid var(--border); white-space:nowrap; letter-spacing:0.6px; text-transform:uppercase; }
  tbody tr { border-bottom:1px solid #f1f5f9; transition:background 0.1s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:#f0fdfa; }
  td { padding:9px 16px; white-space:nowrap; vertical-align:middle; }
  .mrn { font-family:monospace; font-size:12px; color:var(--th); }
  .nm { font-weight:600; color:var(--tp); }
  .nd { color:var(--th); font-style:italic; font-size:12px; }

  /* Blood badge */
  .blood-done { background:var(--greenl); color:var(--green); border:1px solid #a7f3d0; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .blood-not { background:var(--redl); color:var(--red); border:1px solid #fca5a5; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .blood-na { background:var(--bg2); color:var(--th); border:1px solid var(--border); padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .status-btn { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; border:1px solid; cursor:pointer; transition:all 0.15s; white-space:nowrap; font-family:inherit; }
  .s0 { background:#f3f4f6; color:#6b7280; border-color:#d1d5db; }
  .s1 { background:#fef9c3; color:#854d0e; border-color:#fde047; }
  .s2 { background:var(--greenl); color:var(--green); border-color:#a7f3d0; }
  .s3 { background:var(--redl); color:var(--red); border-color:#fca5a5; }
  .s4 { background:var(--purplel); color:#5b21b6; border-color:#c4b5fd; }

  /* Inputs */
  .pi { padding:5px 9px; border-radius:7px; font-size:12px; border:1px solid var(--border); background:var(--bg2); color:var(--tp); font-family:inherit; direction:ltr; transition:all 0.15s; width:130px; }
  .pi:focus { outline:none; border-color:#14b8a6; background:white; }
  .pi::placeholder { color:var(--th); font-size:11px; }

  /* WhatsApp buttons */
  .wbs { display:flex; gap:4px; flex-wrap:wrap; }
  .wb { display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:6px; font-size:11px; font-weight:700; text-decoration:none; border:1px solid; transition:all 0.15s; white-space:nowrap; cursor:pointer; }
  .w-blood { background:var(--redl); color:#991b1b; border-color:#fca5a5; }
  .w-blood:hover { background:#fca5a5; }
  .w-anest { background:var(--purplel); color:#5b21b6; border-color:#c4b5fd; }
  .w-anest:hover { background:#c4b5fd; }
  .w-labs { background:var(--amberl); color:#92400e; border-color:#fcd34d; }
  .w-labs:hover { background:#fcd34d; }
  .wb.off { opacity:0.3; pointer-events:none; }
  .wa-ic { width:12px; height:12px; flex-shrink:0; }

  .loading { padding:70px 20px; text-align:center; color:var(--ts); }
  .spinner { width:32px; height:32px; border:2px solid var(--border); border-top-color:#14b8a6; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty { padding:70px 20px; text-align:center; color:var(--ts); }
  .err { padding:50px 20px; text-align:center; color:var(--ts); }
  .err button { margin-top:14px; padding:9px 22px; border-radius:9px; border:1px solid var(--border); background:var(--bg2); color:#0f766e; cursor:pointer; font-family:inherit; font-size:13px; }
  .sc { font-size:11px; color:#14b8a6; margin-left:4px; font-weight:400; text-transform:none; letter-spacing:0; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">
    <div class="logo-ic">📋</div>
    <div>
      <div class="hdr-title">Pending Files</div>
      <div class="hdr-sub">King Saud Medical City — OR Coordination Department</div>
    </div>
  </div>
  <div class="hdr-stats">
    <div class="st-item"><div class="st-num" id="s-total" style="color:#a7f3d0">—</div><div class="st-lbl">Total</div></div>
    <div class="st-item"><div class="st-num" id="s-anest" style="color:#c4b5fd">—</div><div class="st-lbl">With Anesthesia</div></div>
    <div class="st-item"><div class="st-num" id="s-blood-done" style="color:#86efac">—</div><div class="st-lbl">Blood Done</div></div>
    <div class="st-item"><div class="st-num" id="s-blood-not" style="color:#fca5a5">—</div><div class="st-lbl">Blood Not Done</div></div>
  </div>
</div>

<div class="main">
  <div class="fc">
    <div class="fr">

      <!-- Blood Filter -->
      <div class="fg">
        <div class="fg-lbl">Blood Status</div>
        <div class="fps" id="bp">
          <span class="pill all-pill on" data-val="all">All</span>
          <span class="pill" data-val="Done">Done</span>
          <span class="pill" data-val="Not Done">Not Done</span>
          <span class="pill" data-val="-">N/A</span>
        </div>
      </div>

      <!-- Anesthesia Filter -->
      <div class="fg">
        <div class="fg-lbl">Anesthesia</div>
        <div class="fps" id="ap">
          <span class="pill all-pill on" data-val="all">All</span>
          <span class="pill" data-val="yes">Scheduled</span>
          <span class="pill" data-val="no">Not Scheduled</span>
        </div>
      </div>

    </div>
  </div>

  <div class="rb">
    <div class="rc">Showing <span id="shown">—</span> of <span id="total">—</span> patients &nbsp;·&nbsp; <span style="color:var(--th);font-size:11px;" id="updated"></span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <input class="si" id="search" placeholder="🔍  Search by name or MRN..." style="width:200px;">
      <button class="btn" id="reset-btn">↺ Clear</button>
      <button class="btn btn-refresh" id="refresh-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 013.51 15"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="tc"><div class="tw" id="container">
    <div class="loading"><div class="spinner"></div><div>Loading data...</div></div>
  </div></div>
</div>

<script>
const SHEET_ID='1WIjD1nYYIqd5GAgvtzdGs-QnfXWQ2U9XecnwF_XY0Zg';
const TAB='Sheet1';
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

const WA_IC='<svg class="wa-ic" viewBox="0 0 24 24"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';

let rows=[], selS=new Set(), F={blood:'all', anest:'all'};
let phones={};
const STATUS_LABELS=['⬜ Not Contacted','🟡 No Answer','🟢 Confirmed','🔴 Issue','📤 Sent'];
const STATUS_CLS=['s0','s1','s2','s3','s4'];
function loadStatuses(){ try{ return JSON.parse(localStorage.getItem('pf_statuses')||'{}'); }catch(e){ return {}; } }
function saveStatuses(){ try{ localStorage.setItem('pf_statuses',JSON.stringify(mrnStatuses)); }catch(e){} }
let mrnStatuses=loadStatuses();
function getStatus(mrn){ return mrnStatuses[mrn]!==undefined?mrnStatuses[mrn]:0; }

async function load(){
  document.getElementById('container').innerHTML='<div class="loading"><div class="spinner"></div><div>Loading data...</div></div>';
  const urls=[
    'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(TAB)+'&headers=1&t='+Date.now(),
    'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid=0&t='+Date.now()
  ];
  let csv=null;
  for(const url of urls){ try{ const r=await fetch(url,{cache:'no-store'}); if(r.ok){csv=await r.text();break;} }catch(e){} }
  if(!csv){ document.getElementById('container').innerHTML='<div class="err">⚠️ Failed to load data<br><small>Make sure the sheet is shared publicly</small><br><button onclick="load()">Retry</button></div>'; return; }
  rows=parseCSV(csv);
  updateStats();
  render();
  document.getElementById('updated').textContent='Last updated: '+new Date().toLocaleTimeString('en-SA');
}

function parseCSV(csv){
  return csv.trim().split('\n').slice(1).map(line=>{
    const c=pLine(line);
    return{
      mrn:c[0]||'', lastName:c[1]||'', firstName:c[2]||'',
      blood:c[3]||'-', referal:c[4]||'', anesthesia:c[5]||'',
      surgeon:c[6]||'', procedure:c[7]||'', phone:c[8]||''
    };
  }).filter(r=>r.mrn&&r.mrn!=='Record'&&(r.lastName||r.firstName));
  // تحميل أرقام الجوال المحفوظة في الشيت

}

function pLine(line){ const r=[];let cur='',q=false; for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')q=!q;else if(ch===','&&!q){r.push(cur.trim());cur='';}else cur+=ch;} r.push(cur.trim()); return r; }

function getFullName(r){ return (r.firstName+' '+r.lastName).trim(); }

function pDate(raw){
  if(!raw||raw==='-'||!raw.trim())return null; raw=raw.trim();
  let m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m)return new Date(+m[3],+m[1]-1,+m[2]);
  const d=new Date(raw); return isNaN(d)?null:d;
}

function fDate(raw){
  const d=pDate(raw);
  if(!d)return '<span class="nd">—</span>';
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
}

function pad(n){return String(n).padStart(2,'0');}

function updateStats(){
  const total=rows.length;
  const anest=rows.filter(r=>pDate(r.anesthesia)).length;
  const bloodDone=rows.filter(r=>r.blood==='Done').length;
  const bloodNot=rows.filter(r=>r.blood==='Not Done').length;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-anest').textContent=anest;
  document.getElementById('s-blood-done').textContent=bloodDone;
  document.getElementById('s-blood-not').textContent=bloodNot;
}

function buildSurgeonFilter(){
  const surgeons=[...new Set(rows.map(r=>r.surgeon).filter(Boolean))].sort();
  const el=document.getElementById('sp'); el.innerHTML='';
  const ap=document.createElement('span'); ap.className='pill all-pill'+(selS.size===0?' on':''); ap.textContent='All';
  ap.onclick=()=>{ selS.clear(); document.querySelectorAll('#sp .pill:not(.all-pill)').forEach(p=>p.classList.remove('on')); ap.classList.add('on'); document.getElementById('sc').textContent=''; render(); };
  el.appendChild(ap);
  surgeons.forEach(s=>{ const p=document.createElement('span'); p.className='pill'+(selS.has(s)?' on':''); p.title=s; p.textContent=s.split(' ').slice(0,2).join(' '); p.onclick=()=>{ if(selS.has(s)){selS.delete(s);p.classList.remove('on');}else{selS.add(s);p.classList.add('on');} ap.classList.toggle('on',selS.size===0); document.getElementById('sc').textContent=selS.size>0?'('+selS.size+' selected)':''; render(); }; el.appendChild(p); });
}

document.getElementById('bp').addEventListener('click',e=>{ const p=e.target.closest('.pill');if(!p)return; F.blood=p.dataset.val; document.querySelectorAll('#bp .pill').forEach(x=>x.classList.remove('on')); p.classList.add('on'); render(); });
document.getElementById('ap').addEventListener('click',e=>{ const p=e.target.closest('.pill');if(!p)return; F.anest=p.dataset.val; document.querySelectorAll('#ap .pill').forEach(x=>x.classList.remove('on')); p.classList.add('on'); render(); });
document.getElementById('search').addEventListener('input',render);
document.getElementById('reset-btn').addEventListener('click',()=>{
  F={blood:'all',anest:'all'};
  document.getElementById('search').value='';
  document.querySelectorAll('#bp .pill').forEach((p,i)=>p.classList.toggle('on',i===0));
  document.querySelectorAll('#ap .pill').forEach((p,i)=>p.classList.toggle('on',i===0));
  render();
});
document.getElementById('refresh-btn').addEventListener('click',load);

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=rows.filter(r=>{
    if(F.blood!=='all'&&r.blood!==F.blood)return false;
    if(F.anest==='yes'&&!pDate(r.anesthesia))return false;
    if(F.anest==='no'&&pDate(r.anesthesia))return false;
    const name=getFullName(r).toLowerCase();
    if(q&&!name.includes(q)&&!r.mrn.includes(q))return false;
    return true;
  });

  document.getElementById('shown').textContent=filtered.length;
  document.getElementById('total').textContent=rows.length;

  if(!filtered.length){ document.getElementById('container').innerHTML='<div class="empty">No matching results found</div>'; return; }

  let html='<table><thead><tr><th>MRN</th><th>Contact Status</th><th>Patient Name</th><th>Blood</th><th>Anesthesia Date</th><th>Surgeon</th><th>Procedure</th><th>Phone</th><th>Send Message</th></tr></thead><tbody>';

  filtered.forEach((r,i)=>{
    const idx=rows.indexOf(r);
    const name=getFullName(r);
    const ph=phones[r.mrn]||'';
    const anestDate=fDate(r.anesthesia);
    const anestD=pDate(r.anesthesia);
    const anestDay=anestD?DAYS[anestD.getDay()]:'';
    const anestDs=anestD?pad(anestD.getDate())+'-'+pad(anestD.getMonth()+1)+'-'+anestD.getFullYear():'___';

    // Blood badge
    const bloodBadge = r.blood==='Done'
      ? '<span class="blood-done">✓ Done</span>'
      : r.blood==='Not Done'
      ? '<span class="blood-not">✗ Not Done</span>'
      : '<span class="blood-na">—</span>';

    const cl=ph.replace(/\D/g,'');
    const ok=cl.length>=9;
    const phNum='966'+cl.replace(/^0/,'');
    const rtl='\u202B';

    // رسالة التبرع بالدم
    const mBlood=encodeURIComponent(rtl+'السلام عليكم ورحمة الله وبركاته\n'+rtl+'عزيزي/عزيزتي '+name+'\n'+rtl+'رقم المريض: '+r.mrn+'\n\n'+rtl+'نود إعلامكم بضرورة تسليم ورقة التبرع بالدم لاستكمال متطلبات العملية الجراحية.\n\n'+rtl+'يرجى التوجه إلى قسم تنسيق العمليات في أقرب وقت ممكن لتسليم الورقة المطلوبة.\n\n'+rtl+'للاستفسار: مركز الاتصال 19910\n'+rtl+'مدينة الملك سعود الطبية - قسم تنسيق العمليات');

    // رسالة التذكير بموعد التخدير
    const mAnest=encodeURIComponent(rtl+'السلام عليكم ورحمة الله وبركاته\n'+rtl+'عزيزي/عزيزتي '+name+'\n'+rtl+'رقم المريض: '+r.mrn+'\n\n'+rtl+'نود تذكيركم بموعد عيادة التخدير:\n'+rtl+'📅 يوم '+anestDay+' الموافق '+anestDs+'\n\n'+rtl+'📌 تعليمات مهمة:\n'+rtl+'• يرجى الحضور في الموعد المحدد\n'+rtl+'• إحضار الهوية الوطنية / الإقامة\n'+rtl+'• إحضار جميع نتائج التحاليل والأشعة\n\n'+rtl+'⚠️ عدم الحضور قد يؤثر على جدولة عمليتكم\n\n'+rtl+'مدينة الملك سعود الطبية - قسم تنسيق العمليات');

    // رسالة التذكير بالتحاليل
    const mLabs=encodeURIComponent(rtl+'السلام عليكم ورحمة الله وبركاته\n'+rtl+'عزيزي/عزيزتي '+name+'\n'+rtl+'رقم المريض: '+r.mrn+'\n\n'+rtl+'نود تذكيركم بضرورة إجراء التحاليل المطلوبة قبل موعد عيادة التخدير.\n\n'+rtl+'📅 موعد التخدير: يوم '+anestDay+' الموافق '+anestDs+'\n\n'+rtl+'📌 يرجى إجراء التحاليل قبل الموعد بوقت كافٍ وإحضار نتائجها معكم.\n\n'+rtl+'⚠️ عدم إجراء التحاليل قد يؤثر على جدولة عمليتكم\n\n'+rtl+'مدينة الملك سعود الطبية - قسم تنسيق العمليات');

    const aBlood=ok?'href="https://web.whatsapp.com/send?phone='+phNum+'&text='+mBlood+'" target="_blank"':'';
    const aAnest=ok&&anestD?'href="https://web.whatsapp.com/send?phone='+phNum+'&text='+mAnest+'" target="_blank"':'';
    const aLabs=ok&&anestD?'href="https://web.whatsapp.com/send?phone='+phNum+'&text='+mLabs+'" target="_blank"':'';

    html+='<tr>';
    html+='<td class="mrn">'+r.mrn+'</td>';
    const st=getStatus(r.mrn);
    html+='<td><button class="status-btn '+STATUS_CLS[st]+'" id="st-'+r.mrn+'" onclick="cycleStatus(\''+r.mrn+'\')">'+STATUS_LABELS[st]+'</button></td>';
    html+='<td class="nm">'+name+'</td>';
    html+='<td>'+bloodBadge+'</td>';
    html+='<td>'+(anestD?'<span style="color:#7c3aed;font-weight:500;">'+anestDate+'</span>':'<span class="nd">Not Scheduled</span>')+'</td>';
    html+='<td title="'+r.surgeon+'">'+r.surgeon.split(' ').slice(0,3).join(' ')+'</td>';
    html+='<td>'+(r.procedure||'—')+'</td>';
    html+='<td><input class="pi" placeholder="05XXXXXXXX" value="'+ph+'" oninput="savePhone(\''+r.mrn+'\',this.value)"></td>';
    html+='<td><div class="wbs" id="wa-'+idx+'">';
    html+='<a class="wb w-blood'+(ok?'':' off')+'" '+aBlood+'>'+WA_IC+' Blood</a>';
    html+='<a class="wb w-anest'+(ok&&anestD?'':' off')+'" '+(ok&&anestD?aAnest:'')+'>'+WA_IC+' Anesthesia</a>';
    html+='<a class="wb w-labs'+(ok&&anestD?'':' off')+'" '+(ok&&anestD?aLabs:'')+'>'+WA_IC+' Labs</a>';
    html+='</div></td>';
    html+='</tr>';
  });

  html+='</tbody></table>';
  document.getElementById('container').innerHTML=html;
}

function cycleStatus(mrn){
  mrnStatuses[mrn]=((getStatus(mrn))+1)%5;
  saveStatuses();
  const btn=document.getElementById('st-'+mrn);
  if(btn){ const s=getStatus(mrn); btn.className='status-btn '+STATUS_CLS[s]; btn.textContent=STATUS_LABELS[s]; }
}

function savePhone(mrn, val){
  const cleaned = val.trim();
  phones[mrn] = cleaned;
  // حفظ في Google Sheets
  if(cleaned.length >= 9){
    fetch('https://script.google.com/macros/s/AKfycbzvwcwU5iz4eME4FkSVlBbY8IHuwSkXhDAXyG5WFFO2m2UgesE43KZAgxgZiaxtYVVG/exec', {
      method:'POST',
      body: JSON.stringify({mrn: mrn, phone: cleaned})
    }).catch(e=>console.log('Save error:',e));
  }
}

function updWA(idx){
  // إعادة رسم الصف — بسيط نعيد render
  render();
}

load();
</script>
